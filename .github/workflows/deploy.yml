name: Deploy to Vercel

env:
  VERCEL_ORG_ID: ${{ secrets.ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.PROJECT_ID }}

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # Validates every PR builds; does not deploy (no Vercel secrets needed here).
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    - run: npm ci
    - run: npm run build

  # Deploys on push to main/master using the official Vercel CLI flow.
  # amondnet/vercel-action is retired and bundles an old CLI that Vercel's
  # backend now rejects ("CLI version outdated, requires >=47.2.2"), so we
  # drive `vercel` directly instead of depending on that action being updated.
  deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Vercel CLI
      run: npm install --global vercel@latest

    - name: Pull Vercel environment info
      run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

    - name: Build via Vercel (reads vercel.json's buildCommand/outputDirectory)
      run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

    - name: Deploy prebuilt output to Vercel
      run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
