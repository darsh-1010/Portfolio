<svg viewBox="0 0 720 460" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#151030"/>
      <stop offset="100%" stop-color="#050816"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#915EFF"/>
      <stop offset="100%" stop-color="#5b3aa0"/>
    </linearGradient>
  </defs>
  <rect width="720" height="460" fill="url(#bg3)"/>

  <!-- document / article motif -->
  <rect x="440" y="100" width="180" height="230" rx="12" fill="#1d1836" stroke="#915EFF" stroke-opacity="0.6" stroke-width="2"/>
  <rect x="465" y="130" width="130" height="12" rx="6" fill="#ffffff" fill-opacity="0.85"/>
  <rect x="465" y="160" width="130" height="8" rx="4" fill="#aaa6c3"/>
  <rect x="465" y="178" width="110" height="8" rx="4" fill="#aaa6c3"/>
  <rect x="465" y="196" width="120" height="8" rx="4" fill="#aaa6c3"/>
  <rect x="465" y="222" width="90" height="8" rx="4" fill="#aaa6c3"/>
  <rect x="465" y="240" width="130" height="8" rx="4" fill="#aaa6c3"/>

  <!-- SEO score ring -->
  <circle cx="230" cy="180" r="70" fill="none" stroke="#2a2550" stroke-width="14"/>
  <circle cx="230" cy="180" r="70" fill="none" stroke="url(#ring)" stroke-width="14" stroke-linecap="round"
          stroke-dasharray="352" stroke-dashoffset="55" transform="rotate(-90 230 180)"/>
  <text x="230" y="172" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#ffffff">SEO</text>
  <text x="230" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#aaa6c3">checklist passed</text>

  <text x="60" y="330" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff">AI SEO Blog Generator</text>
  <text x="60" y="365" font-family="Arial, sans-serif" font-size="17" fill="#aaa6c3">Drafts, scores &amp; revises against an on-page SEO checklist</text>
</svg>
