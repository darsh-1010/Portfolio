<svg viewBox="0 0 720 460" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#151030"/>
      <stop offset="100%" stop-color="#050816"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#915EFF"/>
      <stop offset="100%" stop-color="#5b3aa0"/>
    </linearGradient>
  </defs>
  <rect width="720" height="460" fill="url(#bg)"/>

  <!-- radar / search motif -->
  <circle cx="180" cy="180" r="86" fill="none" stroke="#915EFF" stroke-opacity="0.35" stroke-width="2"/>
  <circle cx="180" cy="180" r="56" fill="none" stroke="#915EFF" stroke-opacity="0.5" stroke-width="2"/>
  <circle cx="180" cy="180" r="26" fill="none" stroke="#915EFF" stroke-opacity="0.7" stroke-width="2"/>
  <line x1="180" y1="180" x2="252" y2="122" stroke="#915EFF" stroke-width="3"/>
  <circle cx="252" cy="122" r="7" fill="#915EFF"/>

  <!-- ranking bars -->
  <g>
    <rect x="420" y="260" width="34" height="120" rx="6" fill="url(#bar)"/>
    <rect x="470" y="210" width="34" height="170" rx="6" fill="url(#bar)"/>
    <rect x="520" y="150" width="34" height="230" rx="6" fill="url(#bar)"/>
    <rect x="570" y="190" width="34" height="190" rx="6" fill="url(#bar)"/>
  </g>

  <text x="60" y="330" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#ffffff">Geo Brand Tracker</text>
  <text x="60" y="365" font-family="Arial, sans-serif" font-size="17" fill="#aaa6c3">AI-visibility &amp; ranking across ChatGPT, Gemini, AI Mode</text>
</svg>
